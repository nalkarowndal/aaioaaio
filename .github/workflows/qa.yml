name: AI Studio regression QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest playwright
          python -m playwright install --with-deps chromium
      - name: Unit tests and Python syntax
        run: |
          python -m pytest -q
          python -m compileall -q app.py core scripts
      - name: Markdown fixture browser QA
        run: |
          python -m streamlit run scripts/markdown_fixture.py --server.port 8501 --server.headless true > /tmp/fixture.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://localhost:8501/_stcore/health && break || sleep 1; done
          python scripts/visual_qa.py --fixture --output docs/screenshots/fixture
      - name: Main application browser QA
        env:
          AI_STUDIO_SINGLE_USER_HISTORY: "1"
          AI_STUDIO_HISTORY_DB: "/tmp/ai-studio-p6-history-qa.sqlite3"
          AI_STUDIO_QA_DEBUG: "1"
        run: |
          python -m streamlit run app.py --server.port 8502 --server.headless true > /tmp/app.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://localhost:8502/_stcore/health && break || sleep 1; done
          python scripts/visual_qa.py --url http://localhost:8502 --history --actions --output docs/screenshots/app
      - name: Issue #6 repeated attachment + SQLite QA (5 iterations, 2 modes)
        run: |
          python scripts/issue6_stress_qa.py \
            --url http://localhost:8502 \
            --db /tmp/ai-studio-p6-history-qa.sqlite3 \
            --iterations 5 \
            --output docs/screenshots/issue6
      - name: Issue #6 safe server diagnostics on failure
        if: failure()
        run: |
          if [ -f /tmp/app.log ]; then
            grep '\[QA_DEBUG\]' /tmp/app.log | tail -n 100 || true
          fi
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-studio-visual-qa
          path: docs/screenshots/
          if-no-files-found: ignore